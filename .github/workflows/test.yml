name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.2.3 is the supported baseline; `latest` catches breakage early.
        plugin: ["2.2.3", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Pin @opencode/plugin ${{ matrix.plugin }}
        run: npm install --no-save --package-lock=false @opencode/plugin@${{ matrix.plugin }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
