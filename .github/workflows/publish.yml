name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted publishing needs the OIDC token; no npm token is used or stored.
permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1; pin the major, not @latest.
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:all

      # No NODE_AUTH_TOKEN: npm authenticates with the GitHub OIDC token, and
      # provenance is generated automatically for a public package.
      - name: Publish
        run: npm publish --access public
